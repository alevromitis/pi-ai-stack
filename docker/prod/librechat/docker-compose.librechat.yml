name: librechat

# Topology
# --------
#   librechat    web UI + API on ${APP_PORT}:${APP_CONTAINER_PORT}, six networks:
#                  external  default route, published-port address (see `priority`)
#                  internal  mongodb + meilisearch, no off-host route
#                  litert    litert-lm-external (owned by litert-lm stack)
#                  tools     agent-tools-internal (owned by agent-tools stack):
#                            searxng, shell, filesystem, playwright MCP servers
#                  connectors agent-connectors-internal (owned by agent-connectors
#                            stack): FreshRSS and Nextcloud MCP servers
#                  sandbox   agent-sandbox-internal (owned by agent-sandbox
#                            stack): the per-chat Debian sandbox gateway
#   mongodb      conversation/user store, `internal` only, --noauth, unreachable off-host
#   meilisearch  conversation search index, `internal` only
#   rag_api      file search: chunks and embeds uploads, `internal` + `litert`
#                  (embeddings from litert-lm-2:9379)
#   vectordb     pgvector store for rag_api, `internal` only, trust auth
#
# Model providers (litert-lm-1:9379 chat, litert-lm-2:9379 embeddings) and
# the MCP tool servers (agent-tools, incl. search; agent-connectors;
# agent-sandbox) are external. Those stacks must be up first.
# Upstream: https://github.com/danny-avila/LibreChat/blob/v0.8.7/docker-compose.yml
# Divergences: env_file (not bind-mount), no admin-panel/nginx, split
# internal/external networks, rag_api embeds via LiteRT-LM (not OpenAI)

services:
  librechat:
#    build:
#      context: .
#      dockerfile: Dockerfile
#      target: production
    # digest for v0.8.7:
    #   sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
    image: ghcr.io/danny-avila/librechat:${TAG:-v0.8.7}
    container_name: librechat-1
    restart: unless-stopped
    # The image declares USER node (uid 1000) and pre-creates /app/uploads,
    # /app/logs and /app/client/public/images owned by it, so the bind mounts
    # below must be chown 1000:1000 on the host. See the README.
    user: "1000:1000"
#    privileged: "true"
#    command: ""
    security_opt:
      - "no-new-privileges:true"
#    links:
#      - container
#    cap_add:
#      - rule
#    labels:
#      - "traefik.enable=false"
    environment:
      # Fixed wiring (unchanging per deployment). Edit in .env or .env.librechat.
      HOST: 0.0.0.0
      # Keep identical: PORT is Node bind, APP_CONTAINER_PORT is published side.
      PORT: ${APP_CONTAINER_PORT:-3080}
      MONGO_URI: mongodb://librechat-mongodb-1:27017/LibreChat
      MEILI_HOST: http://librechat-meilisearch-1:7700
      SEARCH: "true"
      CONFIG_PATH: /app/librechat.yaml
      # Setting it turns on file search (agents' file_search tool).
      RAG_API_URL: http://librechat-rag-api-1:8000
    env_file:
      # .env is auto-loaded for interpolation in ports:/volumes (env_file doesn't).
      - .env
      - .env.librechat
    ports:
      - "${APP_PORT:-3080}:${APP_CONTAINER_PORT:-3080}"
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rag_api:
        condition: service_healthy
    healthcheck:
      # The image is node:alpine - it ships busybox wget, not curl.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${APP_CONTAINER_PORT:-3080}/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # API takes time to connect to Mongo and load librechat.yaml on startup.
      start_period: 90s
#    deploy:
#      resources:
#        limits:
#          cpus: "2.0"
#          memory: 2G
#        reservations:
#          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # priority: highest becomes default route and published-port address.
      external:
        priority: 100
      internal:
        priority: 50
      litert:
        priority: 10
      tools:
        priority: 1
      connectors:
        priority: 1
      sandbox:
        priority: 1
#    dns:
#      - ""
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Admin config (custom endpoints, interface), read-only.
      - ./librechat-config/librechat.yaml:/app/librechat.yaml:ro
      - ${LIBRECHAT_DATA_DIR:?set LIBRECHAT_DATA_DIR in .env}/uploads:/app/uploads
      - ${LIBRECHAT_DATA_DIR:?set LIBRECHAT_DATA_DIR in .env}/images:/app/client/public/images
      - ${LIBRECHAT_DATA_DIR:?set LIBRECHAT_DATA_DIR in .env}/logs:/app/logs
#    devices:
#      - "/dev/null"
#    read_only: true
    tmpfs:
      - /tmp
#      - /run:exec

  mongodb:
    # digest for 8.0.20:
    #   sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    image: mongo:${MONGO_TAG:-8.0.20}
    container_name: librechat-mongodb-1
    restart: unless-stopped
    # Data dir must be chown 1000:1000 before first start (matches upstream).
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    # --noauth safe only on `internal` (no off-host route, no port). Don't move to `external`.
    command: ["mongod", "--noauth", "--bind_ip_all"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
#    deploy:
#      resources:
#        limits:
#          cpus: "1.0"
#          memory: 1G
#        reservations:
#          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${LIBRECHAT_MONGO_DATA_DIR:?set LIBRECHAT_MONGO_DATA_DIR in .env}:/data/db
#    read_only: true
    tmpfs:
      - /tmp

  meilisearch:
    # digest for v1.35.1:
    #   sha256:8b57fc3c7f46535ddef3828df1538465ac19d892eb57c9a10da6df0880bd5856
    image: getmeili/meilisearch:${MEILI_TAG:-v1.35.1}
    container_name: librechat-meilisearch-1
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    env_file:
      # Reads MEILI_MASTER_KEY from .env.librechat (LibreChat needs it too).
      - .env
      - .env.librechat
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
#    deploy:
#      resources:
#        limits:
#          cpus: "1.0"
#          memory: 1G
#        reservations:
#          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${LIBRECHAT_MEILI_DATA_DIR:?set LIBRECHAT_MEILI_DATA_DIR in .env}:/meili_data
#    read_only: true
    tmpfs:
      - /tmp

  vectordb:
    # digest for 0.8.0-pg15-trixie:
    #   sha256:8809cfffff0082cf260c9ac752f1dd1afc77f6f0a55c4e6411321e78efc3d9a5
    image: pgvector/pgvector:${PGVECTOR_TAG:-0.8.0-pg15-trixie}
    container_name: librechat-vectordb-1
    restart: unless-stopped
    # Data dir must be chown 1000:1000 before first start, like Mongo's.
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      # Trust safe only on `internal` (no off-host route, no port), like
      # Mongo's --noauth. Don't move to `external`.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${LIBRECHAT_VECTORDB_DATA_DIR:?set LIBRECHAT_VECTORDB_DATA_DIR in .env}:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql

  rag_api:
    # digest for v0.9.0:
    #   sha256:18a8dffa9316276b924bf3fd23bfb4544b0f68f8f6b14c048affb35c01721a35
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:${RAG_API_TAG:-v0.9.0}
    container_name: librechat-rag-api-1
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      DB_HOST: librechat-vectordb-1
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      # Ignored under trust auth; set so the default isn't mistaken for a secret.
      POSTGRES_PASSWORD: unused
      COLLECTION_NAME: librechat
      # LiteRT-LM speaks OpenAI's /v1/embeddings. The model id is litert-lm-2's
      # LITERT_MODEL_ID; the key is a placeholder (no auth, but the client
      # requires one).
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: embeddinggemma2-270m
      RAG_OPENAI_BASEURL: http://litert-lm-2:9379/v1
      RAG_OPENAI_API_KEY: litert-lm
      # Required: when true, langchain sends tiktoken ids instead of text, and
      # LiteRT-LM embeds each id as the string "1234" - garbage vectors, no error.
      RAG_CHECK_EMBEDDING_CTX_LENGTH: "false"
      # EmbeddingGemma 2's retrieval prompts, added by run_with_prefixes.py.
      # Changing either invalidates stored vectors: re-upload files afterwards.
      EMBEDDINGS_QUERY_PREFIX: "task: search result | query: "
      EMBEDDINGS_DOCUMENT_PREFIX: "title: none | text: "
    # Upstream CMD is `python main.py`; this wraps it to add the prefixes.
    command: ["python", "/opt/rag-api/run_with_prefixes.py"]
    env_file:
      # For JWT_SECRET (the only variable in it rag_api reads): rag_api checks
      # LibreChat's tokens with it, and serves every request unauthenticated
      # if it is missing.
      - .env.librechat
    depends_on:
      vectordb:
        condition: service_healthy
    healthcheck:
      # python:slim image: no curl or wget.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # internal: librechat + vectordb. litert: litert-lm-2.
      - internal
      - litert
    volumes:
      - ./rag-api/run_with_prefixes.py:/opt/rag-api/run_with_prefixes.py:ro
    tmpfs:
      - /tmp

  router:
    build:
      context: ./router
    image: librechat-router:local
    container_name: librechat-router-1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    environment:
      # llama-server on the workstation (workstation/llama-qwen), over the
      # tailnet. Its key is PRIMARY_API_KEY in .env.router.
      PRIMARY_BASE_URL: ${QWEN_BASE_URL:-http://<workstation-tailnet-ip>:8091/v1}
      PRIMARY_MODEL: qwen3.5-9b
      # The librechat.yaml endpoint whose spec/preset prompts are Qwen's.
      PRIMARY_ENDPOINT: Qwen
      # Where requests go while the workstation is down, and as what.
      FALLBACK_BASE_URL: http://litert-lm-1:9379/v1
      FALLBACK_API_KEY: litert-lm
      FALLBACK_ENDPOINT: LiteRT-LM
      FALLBACK_PRESET: E2B - Thinker
      FALLBACK_SPEC: pi-chat
      MONGO_URI: mongodb://librechat-mongodb-1:27017/LibreChat
      LIBRECHAT_YAML: /config/librechat.yaml
      TZ: ${TZ:-UTC}
    env_file:
      - .env.router
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # external: default route, to the workstation over the tailnet.
      # internal: librechat-1 and mongodb. litert: litert-lm-1.
      external:
        priority: 100
      internal:
        priority: 50
      litert:
        priority: 10
    volumes:
      - ./librechat-config/librechat.yaml:/config/librechat.yaml:ro
    tmpfs:
      - /tmp

networks:
  # Explicit subnets: rpi's default Docker address pools are exhausted (31
  # networks; see README "Points for improvement"). 10.89.0.0/16 is unused
  # on the host, LAN and tailnet.
  external:
    name: librechat-external
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.10.0/24
  internal:
    name: librechat-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.89.11.0/24
  litert:
    # Owned by litert-lm stack. Declared external so we join it (not duplicate).
    name: ${LITERT_NETWORK:-litert-lm-external}
    external: true
  tools:
    # Owned by agent-tools stack (internal: true). Declared external so we join it.
    name: ${AGENT_TOOLS_NETWORK:-agent-tools-internal}
    external: true
  connectors:
    # Owned by agent-connectors stack (internal: true). Declared external so we join it.
    name: ${AGENT_CONNECTORS_NETWORK:-agent-connectors-internal}
    external: true
  sandbox:
    # Owned by agent-sandbox stack (internal: true). Declared external so we join it.
    name: ${AGENT_SANDBOX_NETWORK:-agent-sandbox-internal}
    external: true
