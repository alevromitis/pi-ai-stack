# LibreChat application config.
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
#
# Schema v1.3.13 for LibreChat v0.8.7 (see TAG in .env). Bump with image tag.
version: 1.3.13
cache: true

endpoints:
  custom:
    # LiteRT-LM's `serve` command (litert-lm 0.18) exposes an OpenAI-compatible
    # server on 0.0.0.0:9379 (GET /v1/models, POST /v1/chat/completions,
    # with tool calls - what lets MCP servers use this endpoint).
    - name: 'LiteRT-LM'
      # From .env.librechat. Missing vars fail with "Missing API Key/Base URL".
      apiKey: '${LITERT_LM_API_KEY}'
      baseURL: '${LITERT_LM_BASE_URL}'
      models:
        # Not fetched: GET /v1/models lists litert-lm-1's whole registry,
        # which also holds gemma4-e4b and an embedding model imported before
        # litert-lm-2 existed (embeddinggemma2-text). That one can't chat: a
        # chat request for it makes litert-lm close Gemma's engine to load
        # it. So the picker shows exactly this list.
        fetch: false
        default:
          - 'gemma4-e2b'
          # Off for now (~3x slower on the Pi); see litert-lm/.env.example.
          # - 'gemma4-e4b'
      # Titles via same chat-completions route. 'current_model' avoids pinning non-existent name.
      titleConvo: true
      titleModel: 'current_model'
      # LiteRT-LM's prefix (KV) cache holds one conversation, and a title
      # request is a miss that closes it. Generate the title after the reply
      # so it doesn't evict the cache mid-turn or compete for the Pi's CPU.
      titleTiming: 'final'
      modelDisplayLabel: 'LiteRT-LM'
      # Google's recommended Gemma sampling is temperature 1.0, top_p 0.95,
      # top_k 64. The model file sets no sampler defaults (`litert-lm
      # describe`). The parameters panel has no top_k, so it is added to
      # every request here; temperature/top_p are set per preset or spec.
      addParams:
        top_k: 64
      # LibreChat's built-in table says gemma4 has 128k context, so chats
      # outside the specs (plain endpoint, edited parameters) showed 128k in
      # the context meter and trimmed history to it, past LiteRT-LM's 16384.
      # Same window as the specs' maxContextTokens below; rates 0 (local).
      tokenConfig:
        'gemma4-e2b':
          prompt: 0
          completion: 0
          context: 13312
        'gemma4-e4b':
          prompt: 0
          completion: 0
          context: 13312

# Web search for agents/chat. LibreChat's built-in webSearch can't be used:
# v0.8.7 (and v0.8.8) refuse to enable it without a scraper (Firecrawl, Serper
# or Tavily) - external APIs, or a multi-container Firecrawl too heavy for the
# Pi. mcp-searxng gives the model `searxng_web_search` + `web_url_read`
# against our own SearXNG instead.
mcpServers:
  # Only Web Search, Wikipedia, Playwright Browser and Debian Sandbox are
  # active (2026-10-10); the rest are commented out, with their
  # allowedAddresses entries. Uncomment both to bring one back.
  # The agent-tools stack: one sandboxed container per server, reached over
  # agent-tools-internal (see its compose file). Shell and filesystem have
  # no network and see only /workspace.
  searxng:
    type: streamable-http
    url: 'http://mcp-searxng-1:8080/mcp'
    title: 'Web Search'
    description: 'SearXNG search and page reading.'
    # A search or page read can be slow from the Pi.
    timeout: 60000
  # Offline English Wikipedia (Kiwix ZIM) in agent-tools, no network: one
  # wikipedia_search tool, 5 passages with links (~600 tokens), ~0.2 s.
  wikipedia:
    type: streamable-http
    url: 'http://mcp-wikipedia-1:8000/mcp'
    title: 'Wikipedia'
    description: 'Offline English Wikipedia: passages with links.'
    timeout: 30000
  # shell:
  #   type: streamable-http
  #   url: 'http://mcp-shell-1:8000/mcp'
  #   title: 'Sandbox Shell'
  #   description: 'Allowlisted commands in /workspace; no network.'
  #   timeout: 130000
  # filesystem:
  #   type: streamable-http
  #   url: 'http://mcp-filesystem-1:8000/mcp'
  #   title: 'Workspace Files'
  #   description: 'Read and write files in the shared agent workspace.'
  playwright:
    type: streamable-http
    url: 'http://mcp-playwright-1:8931/mcp'
    title: 'Playwright Browser'
    description: 'Headless Chromium for pages that need JavaScript or clicks.'
    initTimeout: 60000
    timeout: 120000
  # The agent-connectors stack: the user's own data, reached over
  # agent-connectors-internal (see its compose file). Each container holds
  # one service's API/app password; the agent-tools containers can't reach
  # them. Write tools are on, deletes off (ALLOW_DELETE in its env files).
  # freshrss:
  #   type: streamable-http
  #   url: 'http://mcp-freshrss-1:8000/freshrss/mcp'
  #   title: 'FreshRSS'
  #   description: 'Feeds and unread articles; mark read, star, subscribe.'
  # calendar:
  #   type: streamable-http
  #   url: 'http://mcp-nextcloud-1:8000/calendar/mcp'
  #   title: 'Calendar'
  #   description: 'Nextcloud Calendar: list, add and change events.'
  # tasks:
  #   type: streamable-http
  #   url: 'http://mcp-nextcloud-1:8000/tasks/mcp'
  #   title: 'Tasks'
  #   description: 'Nextcloud Tasks: list, add, complete and change tasks.'
  # notes:
  #   type: streamable-http
  #   url: 'http://mcp-nextcloud-1:8000/notes/mcp'
  #   title: 'Notes'
  #   description: 'Nextcloud Notes: find, read, add to and write notes.'
  # Add-only view of the calendar and tasks (no edit/delete tools exist on
  # it), for agents that read untrusted feed text and file what they find.
  # calendar-add:
  #   type: streamable-http
  #   url: 'http://mcp-nextcloud-1:8000/calendar-add/mcp'
  #   title: 'Calendar Add Only'
  #   description: 'List events and tasks, add new ones; never changes existing entries.'
  # The agent-sandbox stack: a throwaway Debian container per conversation
  # (root shell, internet), over agent-sandbox-internal.
  # The conversation id picks the sandbox, so a new chat gets a fresh one.
  # LibreChat resolves {{LIBRECHAT_BODY_*}} on every tool call, and opens a
  # connection per call for a server that uses them.
  sandbox:
    type: streamable-http
    url: 'http://agent-sandbox-gateway-1:8000/mcp'
    title: 'Debian Sandbox'
    description: 'Fresh Debian container per chat: root shell, internet.'
    headers:
      X-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      X-User-ID: '{{LIBRECHAT_USER_ID}}'
    # A command may run SANDBOX_MAX_TIMEOUT (300 s), plus ~15 s of grace and
    # a fresh sandbox's start. Also LibreChat's HTTP header/body timeout for
    # this server, so the reply can take that long to begin.
    timeout: 360000

mcpSettings:
  # LibreChat blocks MCP URLs that resolve to private addresses unless
  # listed here (host:port, exact).
  allowedAddresses:
    - 'mcp-searxng-1:8080'
    - 'mcp-wikipedia-1:8000'
    # - 'mcp-shell-1:8000'
    # - 'mcp-filesystem-1:8000'
    - 'mcp-playwright-1:8931'
    # - 'mcp-freshrss-1:8000'
    # - 'mcp-nextcloud-1:8000'
    - 'agent-sandbox-gateway-1:8000'

interface:
  # Any modelSpecs list silently turns these three off unless set here
  # (packages/data-schemas/src/app/interface.ts), which hides the LiteRT-LM
  # endpoint and leaves only the specs and Agents in the picker.
  modelSelect: true
  parameters: true
  presets: true

# Without this block LibreChat skips memory entirely - nothing is saved or
# added to prompts - yet the Memories panel still shows (it is hidden only
# by `disabled: true`). Saved memories go at the end of every chat's system
# prompt, so a change re-prefills that chat once.
memory:
  # Total for all saved memories (o200k tokens; Gemma's count is similar).
  # Small, since every new chat prefills them.
  tokenLimit: 1000
  # The memory agent: with each user message, a second LiteRT-LM request
  # with set_memory/delete_memory tools. A real run evicts litert-lm-1's
  # prefix cache, so the reply re-prefills the whole chat; litert-lm's
  # memory gate (LITERT_MEMORY_GATE) answers it without the model unless the
  # newest message asks to remember or forget something. Opt-in in v0.8.7.
  agent:
    enabled: true
    provider: 'LiteRT-LM'
    model: 'gemma4-e2b'
  # What the agent sees: the request plus the exchange before it, so
  # "remember that" can refer to the previous reply. Capped (default 12000)
  # so a long reply can't cost minutes of prefill.
  messageWindowSize: 3
  maxInputTokens: 1500

fileConfig:
  # "Upload as Text" accepts any MIME type by default and reads binaries
  # (images, audio, archives) as raw bytes - a 38 KB webp became ~29k tokens
  # and overflowed the context. Allow only text and formats LibreChat's
  # built-in parser understands (pdf, docx, odt, xlsx/xls, ods).
  text:
    supportedMimeTypes:
      - '^text\/.+$'
      - '^application\/(json|ld\+json|xml|yaml|x-yaml|toml|sql|x-sh|javascript|typescript|x-httpd-php|x-tex|x-subrip)$'
      - '^application\/pdf$'
      - '^application\/vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet)$'
      - '^application\/vnd\.oasis\.opendocument\.(text|spreadsheet)$'
      - '^application\/(vnd\.ms-excel|msexcel|x-msexcel|x-ms-excel|x-excel|x-dos_ms_excel|xls|x-xls)$'

modelSpecs:
  # A single spec: plain LiteRT-LM chat. MCP tool schemas are re-sent (and
  # re-prefilled on the Pi's CPU, ~2 min per 4k tokens) on every model call,
  # so tools are added per chat from the input bar rather than attached here.
  # Leave the plain endpoint/model picker available next to this spec.
  prioritize: false
  list:
    # Plain LiteRT-LM chat, picked for first-time users; after that new
    # chats keep whatever was last chosen. No tool schemas, so the fastest
    # replies; MCP servers can still be added per chat from the input bar.
    - name: 'pi-chat'
      label: 'LiteRT-LM'
      description: 'Plain chat with the local model. Fastest; add tools from the input bar.'
      softDefault: true
      preset:
        endpoint: 'LiteRT-LM'
        model: 'gemma4-e2b'
        # LibreChat counts with tiktoken, not Gemma's tokenizer. LiteRT-LM
        # rejects (500) anything above LITERT_MAX_NUM_TOKENS=16384.
        # maxContextTokens is the whole window (LibreChat subtracts
        # max_tokens for the reply), so history gets 9216 and 13312 leaves
        # headroom for the tokenizer mismatch. Output is 4096 because
        # thought tokens count against it too. Matches tokenConfig above.
        maxContextTokens: 13312
        max_tokens: 4096
        # Turns on Gemma's thinking (any value but 'none'; LiteRT-LM has no
        # per-effort budgets yet). Patched LiteRT-LM streams it back as
        # reasoning_content, shown as "Thoughts". Thought tokens share the
        # max_tokens budget and cost decode time on the Pi; set 'none' in
        # the parameters panel for a quick answer.
        reasoning_effort: 'medium'
        # Deliberately blunt: a 2B model takes hedged wording as optional and
        # answers from memory, so the prompt tells it plainly that its memory
        # is unreliable and that search or "I don't know" are the only
        # acceptable answers to factual questions. It also names what the
        # model does reasonably well (per the Gemma 4 model card: reasoning
        # with thinking, code, 35+ languages; training cutoff January 2025),
        # so it doesn't search or refuse on tasks that need no facts. Short
        # (~400 tokens, prefilled once per chat, then reused by the prefix
        # cache). {{current_date}} changes once a day, so it doesn't break
        # the cache.
        promptPrefix: |
          You are Gemma 4 E2B, a small open model from Google (about 2B effective parameters), running locally on a Raspberry Pi. Your training data ends in January 2025. Today is {{current_date}}, so you know nothing that happened after January 2025.

          What you can do: reason step by step in your thinking, write and explain code, and write, rewrite, summarise or translate text (you know 35+ languages well).

          Your limits (follow them; don't recite them unless asked):
          - Your memory of facts is bad. You misremember names, dates, numbers, quotes and who said what, and you cannot tell when you do. Feeling sure means nothing.
          - You make up plausible-sounding things. Assume anything you "know" is wrong until a search confirms it.
          - You make arithmetic mistakes. Work it out step by step in your thinking and check it; if a code tool is available, run the calculation there.
          - You can miss sarcasm, idioms and figurative language. If a message might not be literal, say how you read it.

          Rules:
          - For any fact, quote, attribution, number, date, name, URL or API detail: search first. Answer only from the results and cite the URL. Never answer facts from memory.
          - Greetings, questions about yourself, and writing, rewriting, summarising or translating text the user gave you need no search.
          - If you cannot search, or the results don't contain the answer, say "I don't know" or "I couldn't verify this". Do not fill the gap.
          - If the question is unclear, ask one short question. Do not guess what was meant.
          - Lead with the answer. Be brief. Do not pad lists to look complete; fewer correct items beat more guessed ones.
          - One tool call at a time; read the result before the next. If a tool fails, say so.
