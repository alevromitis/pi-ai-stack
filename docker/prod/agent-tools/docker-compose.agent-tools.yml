name: agent-tools

# Topology
# --------
#   MCP servers for LibreChat agents, reached over Streamable HTTP at
#   http://<container>:<port>/mcp, none published on the host. kiwix-serve,
#   the one web page here, is published so mcp-wikipedia's links open.
#
#   internal  agent-tools-internal (internal: true). LibreChat joins it as
#             external. Shell and filesystem live ONLY here: no internet,
#             no LAN, no host - an injected prompt can't exfiltrate or pivot.
#   egress    agent-tools-egress. Playwright's browser and mcp-searxng's
#             page reader need the internet. Docker NAT also reaches the
#             LAN; see README "Agent tools".
#   searxng   searxng-external (owned by the searxng stack, must be up).
#   web       agent-tools-web. kiwix-serve alone, for its published port.
#
#   mcp-shell       :8000  allowlisted commands, cwd /workspace (disabled)
#   mcp-filesystem  :8000  read/write confined to /workspace (disabled)
#   mcp-playwright  :8931  headless Chromium; files to /workspace/playwright
#   mcp-searxng     :8080  web search via searxng-1 + web_url_read (no workspace)
#   mcp-wikipedia   :8000  offline Wikipedia search (Kiwix ZIM), internal only
#   mcp-calc        :8000  arithmetic, dates, letter counts; internal only
#   mcp-translate   :8000  offline translation (Argos models); internal only
#   kiwix-serve     :8080  the same ZIM as web pages, published ${KIWIX_PORT}
#
# Shell, filesystem and Playwright share ${AGENT_WORKSPACE_DIR} as
# /workspace (uid 1000), the only host path they can touch. mcp-wikipedia
# and kiwix-serve see only ${WIKIPEDIA_ZIM_DIR}, read-only, mcp-translate
# only ${TRANSLATE_MODELS_DIR}, read-only. mcp-calc sees no host path.

x-sandbox: &sandbox
  restart: unless-stopped
  # tini as PID 1. supergateway runs each server via `sh -c`; when it kills
  # the shell, the server is re-parented to PID 1, and node never reaps it.
  # mcp-shell hit its 128-pid limit with 112 zombies ("can't start new
  # thread") after ~2 days.
  init: true
  user: "1000:1000"
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mcp-shell:
    <<: *sandbox
    # Disabled 2026-10-13: LibreChat doesn't list it (librechat.yaml has it
    # commented out). `docker compose --profile disabled up -d` brings it back.
    profiles: ["disabled"]
    build:
      context: ./
    image: agent-tools-mcp:local
    container_name: mcp-shell-1
    command:
      - supergateway
      - --stdio
      - mcp-shell-server
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --healthEndpoint
      - /healthz
    environment:
      # argv only, no shell string; interpreters are refused by the server's
      # own policy. Its README still requires an external boundary for
      # untrusted input: that is this container (no network, /workspace
      # only, limits).
      ALLOW_COMMANDS: "${SHELL_ALLOW_COMMANDS:?set SHELL_ALLOW_COMMANDS in .env}"
      MCP_SHELL_DEFAULT_TIMEOUT_SECONDS: "30"
      MCP_SHELL_MAX_TIMEOUT_SECONDS: "120"
      # 8k-token model: keep tool output small (LibreChat trims further).
      MCP_SHELL_OUTPUT_LIMIT_BYTES: "16384"
    healthcheck: &mcp-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
          pids: 128
    networks:
      - internal
    volumes:
      - ${AGENT_WORKSPACE_DIR:?set AGENT_WORKSPACE_DIR in .env}:/workspace

  mcp-filesystem:
    <<: *sandbox
    # Disabled 2026-10-13: LibreChat doesn't list it (librechat.yaml has it
    # commented out). `docker compose --profile disabled up -d` brings it back.
    profiles: ["disabled"]
    image: agent-tools-mcp:local
    container_name: mcp-filesystem-1
    depends_on:
      # Shares mcp-shell's image; let that service build it first.
      mcp-shell:
        condition: service_started
    command:
      - supergateway
      - --stdio
      - mcp-server-filesystem /workspace
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      # One long-lived child per session. Stateless mode spawns a Node child
      # per request; LibreChat's parallel connects pushed several past the
      # memory limit ("Aborted (core dumped)").
      - --stateful
      - --healthEndpoint
      - /healthz
    healthcheck: *mcp-health
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    networks:
      - internal
    volumes:
      - ${AGENT_WORKSPACE_DIR:?set AGENT_WORKSPACE_DIR in .env}:/workspace

  mcp-playwright:
    <<: *sandbox
    # Upstream publishes only :latest; pinned by digest so watchtower leaves it.
    image: mcr.microsoft.com/playwright/mcp@${PLAYWRIGHT_MCP_DIGEST:?set PLAYWRIGHT_MCP_DIGEST in .env}
    container_name: mcp-playwright-1
    entrypoint: ["node", "/app/cli.js"]
    command:
      - --headless
      - --browser
      - chromium
      # Chromium's own sandbox needs user namespaces; the container is the sandbox.
      - --no-sandbox
      - --host
      - 0.0.0.0
      - --port
      - "8931"
      # Host header LibreChat sends; the default only allows the bind address.
      - --allowed-hosts
      - mcp-playwright-1:8931
      # Profile in memory: nothing persists between sessions.
      - --isolated
      - --output-dir
      - /workspace/playwright
    tmpfs:
      - /tmp
      # Chromium writes its crashpad/cache under $HOME.
      - /home/node:uid=1000,gid=1000
    # Chromium crashes on Docker's 64M /dev/shm with real pages.
    shm_size: 256m
    healthcheck:
      # Any HTTP answer means the server is up; /mcp rejects a bare GET.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/mcp').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 512
    networks:
      egress:
        priority: 100
      internal:
        priority: 50
    volumes:
      - ${AGENT_WORKSPACE_DIR:?set AGENT_WORKSPACE_DIR in .env}:/workspace

  mcp-searxng:
    <<: *sandbox
    # Pinned (TAG in .env). Was an npx child of librechat-1; here it fetches
    # untrusted pages without sharing a container with LibreChat's secrets.
    image: docker.io/isokoliuk/mcp-searxng:${MCP_SEARXNG_TAG:?set MCP_SEARXNG_TAG in .env}
    container_name: mcp-searxng-1
    environment:
      SEARXNG_URL: http://searxng-1:8080
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_HOST: 0.0.0.0
      # Exact Host header LibreChat sends (DNS-rebinding allowlist).
      MCP_HTTP_ALLOWED_HOSTS: mcp-searxng-1:8080
      # Small-context tuning (see README "Agent tools"): minimal tool
      # schemas, few short results, pages capped at ~1.5k tokens.
      SEARXNG_LITE_TOOLS: "true"
      SEARXNG_MAX_RESULTS: "5"
      SEARXNG_MAX_RESULT_CHARS: "300"
      URL_READ_MAX_CHARS: "6000"
      # DuckDuckGo CAPTCHAs the all-languages region; matches searxng default_lang.
      SEARXNG_DEFAULT_LANGUAGE: en
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 64
    networks:
      egress:
        priority: 100
      internal:
        priority: 50
      searxng:
        priority: 10

  mcp-wikipedia:
    <<: *sandbox
    build:
      context: ./wikipedia
    image: agent-tools-wikipedia:local
    container_name: mcp-wikipedia-1
    environment:
      # The tool's description names the snapshot from the ZIM's own Date
      # metadata, so a newer file needs only WIKIPEDIA_ZIM_FILE changed.
      WIKIPEDIA_ZIM: /zim/${WIKIPEDIA_ZIM_FILE:?set WIKIPEDIA_ZIM_FILE in .env}
      # Exact Host header LibreChat sends (DNS-rebinding allowlist).
      MCP_ALLOWED_HOSTS: mcp-wikipedia-1:8000
      # Small-context tuning (see README "agent-tools"): 5 passages of <=500
      # chars from the top 3 articles, ~2.1k chars (~550 tokens) a search,
      # ending in a Sources line the model is told to copy.
      WIKIPEDIA_RESULTS: "5"
      WIKIPEDIA_ARTICLES: "3"
      WIKIPEDIA_PASSAGE_CHARS: "500"
      # Each passage's link: the article on kiwix-serve below, not on
      # en.wikipedia.org, so it matches the snapshot the answer came from.
      WIKIPEDIA_LINK_BASE: ${WIKIPEDIA_LINK_BASE:?set WIKIPEDIA_LINK_BASE in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Opening the 50 GB archive takes ~1 s on the Pi.
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # ~340 MB RSS measured; the ZIM's page cache fills the rest.
          memory: 512M
          pids: 64
    # No internet, no LAN: it reads one local file.
    networks:
      - internal
    volumes:
      - type: bind
        source: ${WIKIPEDIA_ZIM_DIR:?set WIKIPEDIA_ZIM_DIR in .env}
        target: /zim
        read_only: true
        bind:
          # /mnt/external is a USB disk: if it isn't mounted, fail rather
          # than create an empty directory on the root disk.
          create_host_path: false

  mcp-calc:
    <<: *sandbox
    build:
      context: ./calc
    image: agent-tools-calc:local
    container_name: mcp-calc-1
    environment:
      # Exact Host header LibreChat sends (DNS-rebinding allowlist).
      MCP_ALLOWED_HOSTS: mcp-calc-1:8000
      # date_diff/date_add read "today" in this zone (agent-connectors' too).
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Python + the MCP SDK; nothing cached.
          memory: 256M
          pids: 64
    # No internet, no LAN, no files: pure computation.
    networks:
      - internal

  mcp-translate:
    <<: *sandbox
    build:
      context: ./translate
    image: agent-tools-translate:local
    container_name: mcp-translate-1
    environment:
      TRANSLATE_MODELS: /models
      # Exact Host header LibreChat sends (DNS-rebinding allowlist).
      MCP_ALLOWED_HOSTS: mcp-translate-1:8000
      # Pairs kept in memory (~60-120 MB each); a pivot (el->en->de) uses two.
      # RSS levels off at ~500 MB after many pairs (evicted models are
      # unloaded and malloc_trim'd; fewer arenas hold less freed memory).
      TRANSLATE_KEEP_LOADED: "2"
      MALLOC_ARENA_MAX: "2"
      # The Pi's CPU is the LLM's.
      TRANSLATE_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
          pids: 64
    # No internet, no LAN: it reads local model files.
    networks:
      - internal
    volumes:
      - type: bind
        # Written by translate/fetch_models.py on the host (~5 GB, 60 pairs).
        source: ${TRANSLATE_MODELS_DIR:-/mnt/external/argos-models}
        target: /models
        read_only: true
        bind:
          # On the USB disk, like the ZIM: fail if it isn't mounted.
          create_host_path: false

  kiwix-serve:
    <<: *sandbox
    # Pinned (TAG in .env). Serves the ZIM mcp-wikipedia searches, so the
    # links in its results open the same snapshot: /content/<name>/<path>.
    image: ghcr.io/kiwix/kiwix-serve:${KIWIX_SERVE_TAG:?set KIWIX_SERVE_TAG in .env}
    container_name: kiwix-serve-1
    # Skip the image's start.sh (downloads, unquoted args); init: true reaps.
    entrypoint: ["kiwix-serve"]
    command:
      - --port=8080
      # Also serve it as wikipedia_en_all_nopic (no date), so links in old
      # chats keep working after the snapshot is updated.
      - --nodatealiases
      # The Pi's CPU is the LLM's; 2 is plenty for one reader.
      - --threads=2
      - /zim/${WIKIPEDIA_ZIM_FILE:?set WIKIPEDIA_ZIM_FILE in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # ~245 MB RSS measured after a few pages.
          memory: 512M
          pids: 64
    # Public content, read-only: on the LAN and tailnet like the other UIs.
    ports:
      - "${KIWIX_PORT:?set KIWIX_PORT in .env}:8080"
    networks:
      - web
    volumes:
      - type: bind
        source: ${WIKIPEDIA_ZIM_DIR:?set WIKIPEDIA_ZIM_DIR in .env}
        target: /zim
        read_only: true
        bind:
          create_host_path: false

networks:
  internal:
    name: agent-tools-internal
    driver: bridge
    internal: true
  egress:
    name: agent-tools-egress
    driver: bridge
  web:
    name: agent-tools-web
    driver: bridge
  searxng:
    # Owned by searxng stack. Declared external so we join it (not duplicate).
    name: ${SEARXNG_NETWORK:-searxng-external}
    external: true
