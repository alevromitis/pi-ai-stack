name: agent-sandbox

# Topology
# --------
#   A Debian container per LibreChat conversation, kept (stopped) between
#   visits to that chat: root shell and plain Docker networking (internet, and like any container also the LAN
#   and the host's published ports: no host-side rules, by choice). LibreChat
#   reaches the gateway over Streamable HTTP at
#   http://agent-sandbox-gateway-1:8000/mcp; nothing is published on the host.
#
#   internal  agent-sandbox-internal (internal: true). LibreChat joins it as
#             external. Only the gateway is on it.
#   docker    agent-sandbox-docker (internal: true). Gateway <-> socket proxy
#             only: nothing else can reach the Docker API.
#   egress    agent-sandbox-egress. The sandboxes, and nothing else. External
#             (`make up` creates it), so `make down` leaves it: a kept
#             sandbox can start only on the network it was created on
#             (Docker holds the network's id, not its name).
#
#   gateway       :8000  MCP tools run / run_code / write_file / reset; starts,
#                        execs into, stops and removes the sandboxes through
#                        docker-proxy
#   docker-proxy  :2375  Docker API, containers + exec only
#   sandbox-image        builds agent-sandbox:local, then exits
#
# Sandboxes are not Compose services: the gateway creates them (one per
# conversation, labels agent-sandbox.managed=1 and agent-sandbox.conversation).
# It stops them when idle, running too long, evicted, or at its own stop,
# and starts one again when its chat calls; it removes them on reset, over
# their disk allowance, and once kept past SANDBOX_KEEP_DAYS, SANDBOX_KEEP_MAX
# or SANDBOX_KEEP_DISK. Kept ones are stopped containers in Docker's own
# storage (their writable layer), not a volume: `make down` leaves them.

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - "no-new-privileges:true"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *hardened
    build:
      context: ./gateway
    image: agent-sandbox-gateway:local
    container_name: agent-sandbox-gateway-1
    user: "1000:1000"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      docker-proxy:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: tcp://agent-sandbox-docker-proxy-1:2375
      # Exact Host header LibreChat sends (DNS-rebinding allowlist).
      MCP_ALLOWED_HOSTS: agent-sandbox-gateway-1:8000
      SANDBOX_IMAGE: agent-sandbox:local
      SANDBOX_NETWORK: agent-sandbox-egress
      # Per-sandbox limits and lifecycle, all from .env (see .env.example).
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:?set SANDBOX_MEMORY in .env}
      SANDBOX_MEMORY_SWAP: ${SANDBOX_MEMORY_SWAP:?set SANDBOX_MEMORY_SWAP in .env}
      SANDBOX_CPUS: ${SANDBOX_CPUS:?set SANDBOX_CPUS in .env}
      SANDBOX_CPU_SHARES: ${SANDBOX_CPU_SHARES:-256}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-1024}
      SANDBOX_DISK_LIMIT: ${SANDBOX_DISK_LIMIT:?set SANDBOX_DISK_LIMIT in .env}
      SANDBOX_DISK_DEVICE: ${SANDBOX_DISK_DEVICE:-}
      SANDBOX_DISK_WRITE_BPS: ${SANDBOX_DISK_WRITE_BPS:-50m}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_ACTIVE: ${SANDBOX_MAX_ACTIVE:-3}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-60}
      SANDBOX_MAX_HOURS: ${SANDBOX_MAX_HOURS:-8}
      SANDBOX_DEFAULT_TIMEOUT: ${SANDBOX_DEFAULT_TIMEOUT:-900}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-900}
      SANDBOX_OUTPUT_LIMIT: ${SANDBOX_OUTPUT_LIMIT:-8000}
      SANDBOX_KEEP_DAYS: ${SANDBOX_KEEP_DAYS:-14}
      SANDBOX_KEEP_MAX: ${SANDBOX_KEEP_MAX:-50}
      SANDBOX_KEEP_DISK: ${SANDBOX_KEEP_DISK:-10g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Stops every running sandbox on SIGTERM (kept for its chat to resume).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
    networks:
      - internal
      - docker

  docker-proxy:
    <<: *hardened
    # HAProxy in front of the read-only-mounted socket. It filters by API
    # path and method, not by request body: it can't stop the gateway from
    # asking for a privileged container. The gateway is trusted for that
    # (README.md, "Threat model").
    image: lscr.io/linuxserver/socket-proxy:${SOCKET_PROXY_TAG:?set SOCKET_PROXY_TAG in .env}
    container_name: agent-sandbox-docker-proxy-1
    environment:
      # /containers/* (create, start, stop, inspect, list, delete, and
      # /containers/{id}/exec) and /exec/{id}/start|json.
      CONTAINERS: "1"
      EXEC: "1"
      POST: "1"
      # Defaults kept: PING, VERSION (aiodocker negotiates the API version).
      # Everything else - images (so no pulls), build, volumes, networks,
      # system, swarm, events, archive - stays 0.
      EVENTS: "0"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    read_only: true
    tmpfs:
      - /run
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
          pids: 64
    networks:
      - docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  sandbox-image:
    # Not a sandbox: builds agent-sandbox:local (the gateway starts the real
    # ones from it). Runs `true` and exits; `make up` rebuilds nothing unless the
    # image is missing, so after editing sandbox/Dockerfile run
    # `docker compose -f docker-compose.agent-sandbox.yml build sandbox-image`.
    build:
      context: ./sandbox
    image: agent-sandbox:local
    container_name: agent-sandbox-image-1
    command: ["true"]
    restart: "no"
    networks:
      - egress

networks:
  internal:
    name: agent-sandbox-internal
    driver: bridge
    internal: true
    # Explicit subnets: the host's default Docker address pools are
    # exhausted; librechat has 10.89.10-11, connectors 10.89.20.
    ipam:
      config:
        - subnet: 10.89.30.0/24
  docker:
    name: agent-sandbox-docker
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.89.31.0/24
  egress:
    # Made by `make up` (Makefile: bridge, 10.89.32.0/24), never removed by
    # Compose: kept sandboxes hold its id. See the topology above.
    name: agent-sandbox-egress
    external: true
